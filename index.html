<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HORIZON // Personal Bucket List</title>
    <!-- Pre-paint theme script to prevent flash of unstyled theme -->
    <script>
      (function() {
        try {
          const raw = localStorage.getItem('horizon:v1');
          let theme = 'system';
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.settings && parsed.settings.theme) {
              theme = parsed.settings.theme;
            }
          }
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-ink min-h-screen antialiased selection:bg-silver-400 selection:text-ink transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
